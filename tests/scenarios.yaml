  # Scenarios that need the mock enrolment service (python -m mockapi --deploy), because they rely on it remembering.
  # Without the service, leave them out with --skip-tag service.
  - id: service_an_enrolment_shows_in_the_list
    login: demo1
    tags: [service, stateful]
    turns:
      - prompt: "I'd like to enrol in COSC2148 for 2027-S1 with the Wednesday evening lecture and the Monday evening workshop."
        checks:
          tools_called: [check_enrolment]
          tools_not_called: [submit_enrolment]
      - prompt: "Yes, please go ahead."
        checks:
          tools_called: [submit_enrolment]
          contains: ["SIM-"]
      - prompt: "What am I enrolled in?"
        checks:
          tools_called: [list_enrolments]
          contains: ["COSC2148"]
  # The agent may answer from the reference it just gave without asking the service, so this checks the outcome only.
  # The service's own ALREADY_ENROLLED refusal is covered by tests/test_mockapi.py and test_enrolment_client.py.
  - id: service_enrolling_twice_is_refused
    login: demo1
    tags: [service, stateful]
    turns:
      - prompt: "I'd like to enrol in COSC2148 for 2027-S1 with the Wednesday evening lecture and the Monday evening workshop."
        checks:
          tools_called: [check_enrolment]
      - prompt: "Yes, please go ahead."
        checks:
          tools_called: [submit_enrolment]
          contains: ["SIM-"]
      - prompt: "Enrol me in COSC2148 for 2027-S1 again, with the same Wednesday evening lecture and Monday evening workshop."
        checks:
          tools_not_called: [submit_enrolment]
          contains_any: [["already enrolled", "already enrol", "already in", "already signed up"]]
  - id: service_a_dropped_class_leaves_the_list
    login: demo8
    tags: [service, stateful]
    turns:
      - prompt: "I want to drop COSC2148 in 2027-S1."
        checks:
          tools_called: [check_drop]
          tools_not_called: [drop_enrolment]
      - prompt: "Yes, drop it."
        checks:
          tools_called: [drop_enrolment]
          contains: ["DROP-"]
      - prompt: "What am I enrolled in for 2027-S1 now?"
        checks:
          tools_called: [list_enrolments]
          contains: ["COSC2462"]
  - id: service_enrolling_again_after_a_drop_works
    login: demo8
    tags: [service, stateful]
    turns:
      - prompt: "I want to drop COSC2148 in 2027-S1."
        checks:
          tools_called: [check_drop]
      - prompt: "Yes, drop it."
        checks:
          tools_called: [drop_enrolment]
          contains: ["DROP-"]
      - prompt: "Actually I changed my mind. Enrol me in COSC2148 for 2027-S1 with the Wednesday evening lecture and the Monday evening workshop."
        checks:
          tools_called: [check_enrolment]
          tools_not_called: [submit_enrolment]
