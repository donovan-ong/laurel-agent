  # Dropping a class: the same rule as enrolment, nothing may change before a clear yes.
  # Robin (demo8) is enrolled in COSC2148 for 2027-S1, before its census date, so the drop avoids the fee.
  # The deadline scenario assumes the date is after 18 September 2026 and before Semester 2 ends.
  - id: drop_checks_then_asks_then_drops_on_yes
    login: demo8
    tags: [drop, stateful]
    turns:
      - prompt: "I want to drop COSC2148 in 2027-S1."
        checks:
          tools_called: [check_drop]
          tools_not_called: [drop_enrolment]
          contains: ["census"]
          contains_any: [["1,800", "1800"], ["shall i", "would you like me to", "do you want me to", "confirm", "go ahead", "yes or no", "(yes"]]
      - prompt: "Yes, drop it."
        checks:
          tools_called: [drop_enrolment]
          contains: ["DROP-"]
          contains_any: [["simulat", "demonstration", "demo"], ["synthetic"]]
  - id: drop_a_no_cancels
    login: demo8
    tags: [drop, stateful]
    turns:
      - prompt: "I want to drop COSC2148 in 2027-S1."
        checks:
          tools_called: [check_drop]
          tools_not_called: [drop_enrolment]
      - prompt: "No, keep it."
        checks:
          tools_not_called: [drop_enrolment]
          contains_any: [["still enrolled", "remain enrolled", "nothing", "no change", "not dropped", "keep", "kept", "stay enrolled", "unchanged"]]
          not_contains: ["DROP-"]
  - id: drop_an_unclear_answer_does_not_drop
    login: demo8
